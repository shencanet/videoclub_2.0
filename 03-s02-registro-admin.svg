<svg xmlns="http://www.w3.org/2000/svg" width="760" height="410" viewBox="0 0 760 410" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><title id="t">S-02: registro como administrador</title><desc id="d">Antes el servidor acepta el rol que envía el cliente y cualquiera se convierte en admin. Después ignora el rol y todos los registros son usuarios normales.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0.5" y="0.5" width="759" height="409" rx="16" fill="#f8fafc" stroke="#e2e8f0"/><text x="380" y="38" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#0f172a" text-anchor="middle">S-02 · Registro como administrador</text><rect x="40" y="64" width="64" height="24" rx="12" fill="#dc2626"/><text x="72.0" y="80.5" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">ANTES</text><rect x="40" y="106" width="310" height="62" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="195.0" y="132.625" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#0f172a" text-anchor="middle">Cliente envía</text><text x="195.0" y="150.125" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.0" font-weight="normal" fill="#0f172a" text-anchor="middle">{ email, password, &quot;role&quot;: &quot;admin&quot; }</text><line x1="195" y1="170" x2="195" y2="206" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="210" width="310" height="62" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/><text x="195.0" y="236.625" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#7c2d12" text-anchor="middle">API: User.create({ ..., role })</text><text x="195.0" y="254.125" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#7c2d12" text-anchor="middle">toma el rol que manda el cliente</text><line x1="195" y1="274" x2="195" y2="310" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="314" width="310" height="62" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="195.0" y="340.625" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#7f1d1d" text-anchor="middle">BD: role = admin</text><text x="195.0" y="358.125" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#7f1d1d" text-anchor="middle">cualquiera es administrador</text><rect x="410" y="64" width="80" height="24" rx="12" fill="#16a34a"/><text x="450.0" y="80.5" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">DESPUÉS</text><rect x="410" y="106" width="310" height="62" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="565.0" y="132.625" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#0f172a" text-anchor="middle">Cliente envía</text><text x="565.0" y="150.125" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.0" font-weight="normal" fill="#0f172a" text-anchor="middle">{ email, password, &quot;role&quot;: &quot;admin&quot; }</text><line x1="565" y1="170" x2="565" y2="206" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="410" y="210" width="310" height="62" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="565.0" y="236.625" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#0f172a" text-anchor="middle">API: ignora el role del body</text><text x="565.0" y="254.125" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#0f172a" text-anchor="middle">const { name, email, password }</text><line x1="565" y1="274" x2="565" y2="310" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="410" y="314" width="310" height="62" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="565.0" y="340.625" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#14532d" text-anchor="middle">BD: role = user (por defecto)</text><text x="565.0" y="358.125" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#14532d" text-anchor="middle">los admins se crean a mano</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>