<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><title id="t">S-11: alquileres por usuario</title><desc id="d">Antes un alquiler de cualquier usuario bloquea a todos los demás y no se puede devolver. Después cada usuario tiene su propio límite y existe un endpoint para devolver.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0.5" y="0.5" width="759" height="399" rx="16" fill="#f8fafc" stroke="#e2e8f0"/><text x="380" y="38" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#0f172a" text-anchor="middle">S-11 · Un alquiler por usuario, no por sistema</text><rect x="40" y="64" width="64" height="24" rx="12" fill="#dc2626"/><text x="72.0" y="80.5" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">ANTES</text><rect x="40" y="104" width="310" height="44" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="195.0" y="130.375" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.0" font-weight="normal" fill="#0f172a" text-anchor="middle">Order.find()  // pedidos de todos</text><rect x="40" y="176" width="310" height="50" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="56" y="206" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#0f172a" text-anchor="start">Ana alquila</text><rect x="188" y="189" width="150" height="24" rx="12.0" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="263.0" y="205.2" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#14532d" text-anchor="middle">Permitido</text><rect x="40" y="238" width="310" height="50" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="56" y="268" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#0f172a" text-anchor="start">Beto alquila</text><rect x="188" y="251" width="150" height="24" rx="12.0" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/><text x="263.0" y="267.2" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#7f1d1d" text-anchor="middle">Bloqueado por Ana</text><rect x="40" y="300" width="310" height="50" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="56" y="330" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#0f172a" text-anchor="start">Ana devuelve</text><rect x="188" y="313" width="150" height="24" rx="12.0" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/><text x="263.0" y="329.2" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#7f1d1d" text-anchor="middle">No existe endpoint</text><rect x="410" y="64" width="80" height="24" rx="12" fill="#16a34a"/><text x="450.0" y="80.5" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">DESPUÉS</text><rect x="410" y="104" width="310" height="44" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="565.0" y="130.375" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.0" font-weight="normal" fill="#0f172a" text-anchor="middle">findOne({ userId, returned: false })</text><rect x="410" y="176" width="310" height="50" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="426" y="206" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="b