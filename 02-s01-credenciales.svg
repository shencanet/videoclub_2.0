<svg xmlns="http://www.w3.org/2000/svg" width="760" height="370" viewBox="0 0 760 370" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><title id="t">S-01: credenciales en el repositorio</title><desc id="d">Antes el archivo .env se sube a GitHub y cualquiera puede leer la base de datos y firmar tokens de admin. Después el .env queda ignorado y los secretos viven solo en el servidor.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0.5" y="0.5" width="759" height="369" rx="16" fill="#f8fafc" stroke="#e2e8f0"/><text x="380" y="38" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#0f172a" text-anchor="middle">S-01 · Credenciales en el repositorio</text><rect x="35" y="62" width="64" height="24" rx="12" fill="#dc2626"/><text x="67.0" y="78.5" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">ANTES</text><rect x="35" y="100" width="150" height="64" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="110.0" y="127.625" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#7f1d1d" text-anchor="middle">Archivo .env con</text><text x="110.0" y="145.125" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#7f1d1d" text-anchor="middle">URI y JWT_SECRET</text><line x1="187" y1="132" x2="212" y2="132" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="215" y="100" width="150" height="64" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="290.0" y="127.625" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="nor