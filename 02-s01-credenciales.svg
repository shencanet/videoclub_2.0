etica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#14532d" text-anchor="middle">el .gitignore</text><line x1="187" y1="270" x2="212" y2="270" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="215" y="238" width="150" height="64" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="290.0" y="265.625" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#0f172a" text-anchor="middle">Solo .env.example</text><text x="290.0" y="283.125" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#0f172a" text-anchor="middle">con nombres vacíos</text><line x1="367" y1="270" x2="392" y2="270" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="395" y="238" width="150" height="64" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="470.0" y="265.625" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#0f172a" text-anchor="middle">Secretos solo en</text><text x="470.0" y="283.125" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#0f172a" text-anchor="middle">Render y Atlas</text><line x1="547" y1="270" x2="572" y2="270" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="575" y="238" width="150" height="64" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="650.0" y="265.625" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#14532d" text-anchor="middle">Repo sin secretos</text><text x="650.0" y="283.125" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#14532d" text-anchor="middle">y claves rotadas</text><text x="380" y="338" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.5" font-weight="normal" 